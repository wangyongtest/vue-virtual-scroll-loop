<svg viewBox="0 0 680 540" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="26" text-anchor="middle" font-size="15" font-weight="500" fill="#2C2C2A">无限循环滚动：无缝衔接原理</text>

  <text x="60" y="52" font-size="13" font-weight="500" fill="#26215C">1. 复制多份拼成长条（repeatCount ≥ 2）</text>
  <rect x="60" y="64" width="186" height="72" fill="#CECBF6"/>
  <rect x="246" y="64" width="186" height="72" fill="#9FE1CB"/>
  <rect x="432" y="64" width="186" height="72" fill="#CECBF6"/>
  <rect x="60" y="64" width="560" height="72" rx="10" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
  <line x1="246" y1="64" x2="246" y2="136" stroke="#B5D4F4" stroke-width="0.5"/>
  <line x1="432" y1="64" x2="432" y2="136" stroke="#B5D4F4" stroke-width="0.5"/>
  <text x="153" y="84" text-anchor="middle" font-size="11" fill="#26215C">copy 1</text>
  <text x="339" y="84" text-anchor="middle" font-size="11" fill="#04342C">copy 2</text>
  <text x="525" y="84" text-anchor="middle" font-size="11" fill="#26215C">copy 3</text>
  <text x="72" y="120" font-size="10" fill="#444441">item0 … itemN</text>
  <text x="446" y="120" font-size="10" fill="#444441">同 copy1 内容</text>
  <rect x="312" y="40" width="120" height="96" rx="6" fill="none" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="372" y="34" text-anchor="middle" font-size="11" fill="#185FA5">viewport 视口</text>
  <text x="618" y="150" text-anchor="end" font-size="11" fill="#5F5E5A">scrollLength = total × step</text>

  <text x="60" y="200" font-size="13" font-weight="500" fill="#712B13">2. 位移取模：pos = ((pos + Δ) % L + L) % L</text>
  <line x1="80" y1="270" x2="596" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="80" cy="270" r="4" fill="#185FA5"/>
  <circle cx="600" cy="270" r="4" fill="#185FA5"/>
  <text x="80" y="262" text-anchor="middle" font-size="11" fill="#444441">pos = 0</text>
  <text x="600" y="262" text-anchor="middle" font-size="11" fill="#444441">pos = L</text>
  <path d="M600 284 C 600 342, 80 342, 80 284" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="340" y="356" text-anchor="middle" font-size="11" fill="#993C1D">超过 L → 自动回卷到 0</text>
  <text x="80" y="304" font-size="11" fill="#5F5E5A">L 处渲染内容 = 0 处内容（复制所致）→ 视觉无跳变</text>

  <text x="60" y="384" font-size="13" font-weight="500" fill="#04342C">3. 无缝衔接瞬间</text>
  <rect x="90" y="400" width="180" height="84" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
  <rect x="100" y="416" width="36" height="52" fill="#3C3489"/>
  <rect x="140" y="416" width="36" height="52" fill="#085041"/>
  <rect x="180" y="416" width="36" height="52" fill="#085041"/>
  <rect x="220" y="416" width="36" height="52" fill="#3C3489"/>
  <text x="100" y="412" font-size="10" fill="#26215C">i9</text>
  <text x="140" y="412" font-size="10" fill="#04342C">i0</text>
  <text x="180" y="412" font-size="10" fill="#04342C">i1</text>
  <text x="180" y="396" text-anchor="middle" font-size="11" fill="#444441">pos ≈ L − vp</text>

  <line x1="272" y1="442" x2="406" y2="442" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="339" y="436" text-anchor="middle" font-size="11" fill="#0F6E56">内容连续</text>

  <rect x="410" y="400" width="180" height="84" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <rect x="420" y="416" width="36" height="52" fill="#085041"/>
  <rect x="460" y="416" width="36" height="52" fill="#085041"/>
  <rect x="500" y="416" width="36" height="52" fill="#3C3489"/>
  <rect x="540" y="416" width="36" height="52" fill="#3C3489"/>
  <text x="420" y="412" font-size="10" fill="#04342C">i0</text>
  <text x="460" y="412" font-size="10" fill="#04342C">i1</text>
  <text x="500" y="412" font-size="10" fill="#26215C">i2</text>
  <text x="500" y="396" text-anchor="middle" font-size="11" fill="#444441">pos = 0（取模后）</text>

  <text x="340" y="512" text-anchor="middle" font-size="11" fill="#5F5E5A">item9 滚出、item0 早已顶上 → 无白屏、无跳变</text>
</svg>
